name: Deploy SkyYard
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# Least-privilege default: workflows get broad GITHUB_TOKEN scopes
# (contents:write, etc.) unless explicitly restricted. Neither job here
# writes anything to the repo — read access is all either needs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHA, not the mutable v4 tag — a compromised or
      # re-tagged action could otherwise inject arbitrary code into this
      # pipeline without any change to this file. SHAs resolved from the
      # actions/checkout and actions/setup-node repos directly (v4.4.0,
      # current as of this hardening pass).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Notify Slack on failure
        if: failure()
        # Context expressions interpolated directly into a run: shell string
        # (the old ${{ github.ref }} inline) are a known script-injection
        # vector — a crafted ref/branch name can break out of the string.
        # Passed through env: instead, referenced as shell variables.
        run: |
          curl -X POST "$SLACK_WEBHOOK" -d "{\"text\":\"Build failed on $GITHUB_REF\"}"
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  deploy-staging:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Cloud Run
        run: echo "Deployment command would go here"
        # env: { GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }} }
